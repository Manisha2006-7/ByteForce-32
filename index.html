<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GenAI Bill Extractor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to right, #f8f9fa, #e3f2fd);
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    nav {
      width: 100%;
      background: #1a237e;
      padding: 20px;
      color: white;
      font-size: 24px;
      font-weight: 600;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 40px;
    }

    h1 {
      color: #1a237e;
      margin-bottom: 20px;
    }

    .instructions {
      background-color: #fff3e0;
      border-left: 6px solid #ff9800;
      padding: 15px 20px;
      margin-bottom: 30px;
      color: #e65100;
      font-size: 15px;
      border-radius: 8px;
      max-width: 600px;
      text-align: left;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      max-width: 500px;
    }

    input[type="file"],
    select,
    button {
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #3949ab;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #283593;
    }

    #result {
      margin-top: 25px;
      padding: 15px;
      background-color: #f5f5f5;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      white-space: pre-wrap;
      border: 1px dashed #bbb;
      max-width: 600px;
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
    }

    footer {
      background-color: #1a237e;
      color: white;
      text-align: center;
      padding: 15px;
      font-size: 14px;
      width: 100%;
      margin-top: 60px;
    }
  </style>
</head>
<body>

  <nav>🧾 GenAI Bill Extractor</nav>

  <h1>Upload Your Bill</h1>

  <div class="instructions">
    <strong>How it works:</strong><br>
    📎 Upload your bill or receipt (PDF, JPG, PNG)<br>
    📄 Choose a matching template<br>
    🔍 Click "Extract" to view structured data<br>
    📥 Download or copy extracted fields
  </div>

  <form id="uploadForm">
    <input type="file" id="fileInput" required />

    <select id="template" required>
      <option value="default">🧾 Default</option>
      <option value="swiggy">Office</option>
      <option value="zomato">Invoice</option>
      <option value="amazon">Hospital bills</option>
      <option value="flipkart">Utilities</option>
      <option value="uber">Transportation</option>
    </select>

    <button type="submit">Extract</button>
  </form>

  <div id="result"></div>

  <footer>
    © 2025 GenAI Bill Extractor • Powered by OCR + Regex 💡
  </footer>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const file = document.getElementById("fileInput").files[0];
      const template = document.getElementById("template").value;
      const formData = new FormData();
      formData.append("file", file);
      formData.append("template_name", template);

      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "⏳ Processing...";

      try {
        const res = await fetch("http://localhost:8000/upload", {
          method: "POST",
          body: formData,
        });

        const data = await res.json();
        resultDiv.innerHTML = "<pre>" + JSON.stringify(data, null, 2) + "</pre>";
      } catch (error) {
        resultDiv.innerHTML = "❌ Error: " + error.message;
      }
    });
  </script>

</body>
</html>
